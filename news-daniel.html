<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0C2A44">
<link rel="icon" type="image/png" href="logo-daniel-color.png">
<style>
:root{ --hero:#0C2A44; --sub:#9FB3C8; --acc:#D8B45A; --accTx:#0C2A44; --tile:#173A5C;
  --cream:#FBFAF7; --ink:#22262B; --ink2:#5A5F66; --ink3:#8A8F98; --line:#E7E4DC; }
*{box-sizing:border-box;margin:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
  background:var(--cream);color:var(--ink);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}
.nav{position:sticky;top:0;z-index:100;background:rgba(251,250,247,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line)}
.nav-in{max-width:1040px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px}
.nav-b{display:flex;align-items:center;gap:9px;font-weight:900;color:var(--hero);font-size:15px}
.nav-b img{width:28px;height:28px;object-fit:contain;border-radius:7px}
.nav-l{margin-left:auto;display:flex;gap:4px;flex-wrap:wrap}
.nav-l a{padding:7px 12px;border-radius:9px;font-size:13px;font-weight:700;color:var(--ink2)}
.nav-l a.on,.nav-l a:hover{background:var(--hero);color:#fff}
.hero{background:var(--hero);color:#fff;text-align:center;padding:64px 20px 58px}
.hero .eng{font-size:11px;letter-spacing:.18em;color:var(--sub)}
.hero h1{font-size:clamp(24px,4.6vw,38px);font-weight:900;margin:14px 0 10px;line-height:1.4}
.hero p{color:var(--sub);font-size:15px}
.cta{display:inline-block;margin-top:22px;background:var(--acc);color:var(--accTx);
  font-weight:900;font-size:14.5px;border-radius:100px;padding:13px 26px}
.wrap{max-width:1040px;margin:0 auto;padding:0 18px}
.sec{padding:46px 0 8px}
.sec h2{font-size:20px;font-weight:900;color:var(--hero);margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 19px}
.card b{display:block;font-size:15px;color:var(--hero);margin-bottom:6px}
.card p{font-size:13.5px;color:var(--ink2)}
.ph{background:#EFECE4;border-radius:14px;min-height:150px;display:flex;align-items:center;
  justify-content:center;color:#A9A599;font-size:12.5px;font-weight:700}
.news-it{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 17px;margin-bottom:10px;display:block}
.news-it .t{font-weight:800;font-size:15px}
.news-it .m{font-size:12px;color:var(--ink3);margin-top:3px}
.news-it .b{font-size:13.5px;color:var(--ink2);margin-top:7px;white-space:pre-wrap}
.note{font-size:12.5px;color:var(--ink3)}
.tbl{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tbl th{background:var(--hero);color:#fff;font-size:13px;padding:10px 14px;text-align:left}
.tbl td{padding:11px 14px;border-top:1px solid var(--line);font-size:13.5px}
footer{margin-top:56px;border-top:1px solid var(--line);padding:26px 18px 40px;text-align:center;
  font-size:12.5px;color:var(--ink3)}
footer a{color:var(--ink2);font-weight:700}
@media(max-width:640px){ .nav-l a{padding:6px 9px;font-size:12px} }
</style>
<title>소식 · 다니엘 아마츠</title>
</head>
<body>
<nav class="nav"><div class="nav-in">
  <a class="nav-b" href="index.html"><img src="logo-daniel-color.png" onerror="this.style.display='none'">다니엘 아마츠</a>
  <div class="nav-l"><a href="index.html">홈</a><a href="about-daniel.html">소개</a><a href="news-daniel.html" class="on">소식</a><a href="admission-daniel.html">입학 안내</a><a href="visit-daniel.html">오시는 길</a></div>
</div></nav>

<header class="hero" style="padding:44px 20px 38px">
  <h1 style="font-size:26px">📰 학교 소식</h1>
  <p>공개해도 좋은 소식만 골라 올립니다.</p>
</header>
<div class="wrap">
  <section class="sec">
    <div id="news-list"><p class="note">소식을 불러오는 중…</p></div>
  </section>
</div>
<script src="site-config.js"></script>
<script type="module">
import { loadNews } from './news-loader.js';
loadNews('daniel', 50, document.getElementById('news-list'));
</script>
<footer>
  다니엘 아마츠 · 경기도 수원시 [주소 넣기] · 상담 [전화번호 넣기]<br>
  <span style="font-size:11.5px">본 사이트는 대외 안내용입니다</span>
</footer>
</body>
</html>
